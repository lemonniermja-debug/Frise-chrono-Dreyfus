<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frise interactive – L'affaire Dreyfus</title>
<style>
  :root {
    --bg: #faf7f2;
    --ink: #1f2430;
    --muted: #5d6475;
    --accent: #1d3a6e;
    --accent-2: #b3261e;
    --card: #ffffff;
    --line: #c9c2b4;
    --press: #fff3d6;
    --press-border: #e0a82e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: var(--bg);
    color: var(--ink);
    padding: 20px 16px 28px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 {
    font-size: clamp(1.3rem, 2.6vw, 1.9rem);
    margin: 0 0 4px;
    color: var(--accent);
  }
  .sub { margin: 0 0 22px; color: var(--muted); font-family: system-ui, sans-serif; font-size: .95rem; }

  /* ---------- Frise ---------- */
  .timeline {
    position: relative;
    display: flex;
    justify-content: space-between;
    margin: 0 0 24px;
    padding: 0 8px;
  }
  .timeline::before {
    content: "";
    position: absolute;
    top: 26px; left: 8%; right: 8%;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
  }
  .progress {
    position: absolute;
    top: 26px; left: 8%;
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
    width: 0;
    transition: width .35s ease;
  }
  .step {
    position: relative;
    flex: 1;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    font-family: system-ui, sans-serif;
    text-align: center;
    color: var(--muted);
  }
  .dot {
    display: block;
    width: 36px; height: 36px;
    margin: 10px auto 8px;
    border-radius: 50%;
    background: var(--card);
    border: 4px solid var(--line);
    transition: transform .2s, border-color .2s, background .2s;
  }
  .step:hover .dot { transform: scale(1.12); border-color: var(--accent); }
  .step:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 4px; border-radius: 8px; }
  .step.active .dot { background: var(--accent); border-color: var(--accent); transform: scale(1.2); }
  .step.visited .dot { border-color: var(--accent); }
  .year { display: block; font-weight: 700; font-size: 1.1rem; color: var(--ink); }
  .step.active .year { color: var(--accent); }
  .tag { display: block; font-size: .78rem; margin-top: 2px; padding: 0 4px; }

  /* ---------- Panneau de détail ---------- */
  .panel {
    background: var(--card);
    border-left: 6px solid var(--accent);
    border-radius: 10px;
    padding: 20px 22px;
    box-shadow: 0 2px 10px rgba(0,0,0,.07);
    min-height: 280px;
  }
  .panel .date {
    font-family: system-ui, sans-serif;
    text-transform: uppercase;
    letter-spacing: .06em;
    font-size: .8rem;
    color: var(--accent-2);
    font-weight: 700;
    margin: 0 0 4px;
  }
  .panel h2 { margin: 0 0 10px; font-size: 1.4rem; }
  .panel p { line-height: 1.55; margin: 0 0 12px; }
  .press {
    background: var(--press);
    border: 1px solid var(--press-border);
    border-radius: 8px;
    padding: 10px 14px;
    margin: 14px 0;
    font-size: .97rem;
  }
  .press strong { font-family: system-ui, sans-serif; }
  .question {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
    font-style: italic;
    color: var(--accent);
  }
  .question::before { content: "💬 À toi de jouer : "; font-style: normal; font-weight: 700; }

  .nav { display: flex; justify-content: space-between; margin-top: 16px; font-family: system-ui, sans-serif; }
  .nav button {
    background: var(--accent);
    color: #fff;
    border: 0;
    padding: 9px 18px;
    border-radius: 6px;
    font-size: .95rem;
    cursor: pointer;
  }
  .nav button:disabled { background: var(--line); cursor: default; }
  .nav button:not(:disabled):hover { background: #14294f; }
  .hint { text-align: center; font-family: system-ui, sans-serif; color: var(--muted); font-size: .85rem; margin-top: 10px; }

  .fade { animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .fade { animation: none; }
    .progress, .dot { transition: none; }
  }

  /* ---------- Mobile : frise verticale compacte ---------- */
  @media (max-width: 640px) {
    .timeline { padding: 0; }
    .tag { display: none; }
    .timeline::before, .progress { top: 34px; left: 10%; right: 10%; }
    .dot { width: 28px; height: 28px; margin-top: 20px; }
    .year { font-size: .9rem; }
    .panel { padding: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>L'affaire Dreyfus, 1894-1906</h1>
  <p class="sub">Clique sur une date (ou utilise les flèches ← → du clavier) pour découvrir chaque étape.</p>

  <div class="timeline" id="timeline" role="tablist" aria-label="Frise chronologique de l'affaire Dreyfus">
    <div class="progress" id="progress"></div>
  </div>

  <div class="panel fade" id="panel" role="tabpanel" aria-live="polite"></div>

  <div class="nav">
    <button id="prev">← Précédent</button>
    <button id="next">Suivant →</button>
  </div>
  <p class="hint">Observe le rôle joué par la presse à chaque étape (encadré jaune).</p>
</div>

<script>
const steps = [
  {
    year: "1894",
    tag: "Arrestation",
    date: "15 octobre – 22 décembre 1894",
    title: "Un capitaine accusé de trahison",
    text: "Le capitaine Alfred Dreyfus, officier juif alsacien, est arrêté et accusé d'avoir livré des documents militaires à l'Allemagne. L'accusation repose sur le « bordereau », une lettre découverte à l'ambassade d'Allemagne, dont l'écriture lui est attribuée. Lors du procès, des pièces secrètes sont montrées aux juges sans que l'accusé ni son avocat puissent les consulter, ce qui est illégal. Dreyfus est condamné à la déportation à vie sur l'île du Diable (Guyane).",
    press: "Dès l'arrestation, des journaux nationalistes comme <em>La Libre Parole</em> d'Édouard Drumont alimentent la haine et l'antisémitisme. L'opinion est convaincue de sa culpabilité avant même le procès.",
    question: "Pourquoi le secret des pièces communiquées aux juges est-il un problème pour la justice ?"
  },
  {
    year: "1896",
    tag: "Picquart",
    date: "Mars 1896",
    title: "Un officier découvre la vérité",
    text: "Le lieutenant-colonel Georges Picquart, nouveau chef du service de renseignements, comprend que l'écriture du bordereau correspond à celle du commandant Esterhazy, et non à celle de Dreyfus. Il en informe sa hiérarchie, qui refuse de rouvrir l'affaire pour ne pas reconnaître l'erreur de l'armée. Picquart est écarté et envoyé en Tunisie.",
    press: "La presse ne sait encore rien. L'information est étouffée au sein de l'institution : c'est l'illustration d'un secret qui protège l'institution plutôt que la vérité.",
    question: "Que risque Picquart en parlant ? Que ferais-tu à sa place ?"
  },
  {
    year: "1898",
    tag: "J'accuse",
    date: "11 et 13 janvier 1898",
    title: "Esterhazy acquitté, Zola prend la plume",
    text: "Esterhazy est jugé par un conseil de guerre et acquitté en quelques minutes, le 11 janvier. Deux jours plus tard, l'écrivain Émile Zola publie une lettre ouverte au président de la République, Félix Faure. Il y accuse nommément des chefs de l'armée d'avoir condamné un innocent et couvert le vrai coupable. Zola est à son tour condamné pour diffamation et doit s'exiler à Londres.",
    press: "Le quotidien <em>L'Aurore</em>, dirigé par Georges Clemenceau, publie « J'accuse…! » en première page. Le tirage atteint environ 200 000 exemplaires. La presse devient un véritable contre-pouvoir : l'opinion se divise entre dreyfusards et antidreyfusards.",
    question: "Zola risque la prison. Pourquoi publie-t-il quand même ? Que veut-il provoquer ?"
  },
  {
    year: "1899",
    tag: "Grâce",
    date: "Septembre 1899",
    title: "Rennes : un second procès, une grâce",
    text: "La Cour de cassation annule le premier jugement et Dreyfus, ramené de l'île du Diable, est rejugé à Rennes par un nouveau conseil de guerre. Malgré les preuves de son innocence, il est de nouveau condamné, à dix ans de détention avec « circonstances atténuantes ». Le président Émile Loubet lui accorde sa grâce quelques jours plus tard, mais il n'est pas innocenté.",
    press: "La presse suit le procès jour après jour et l'affaire est couverte à l'étranger. L'indignation internationale pèse sur la décision de gracier Dreyfus.",
    question: "Une grâce est-elle la même chose qu'une réhabilitation ? Pourquoi Dreyfus la juge-t-il insuffisante ?"
  },
  {
    year: "1906",
    tag: "Réhabilitation",
    date: "12 juillet 1906",
    title: "L'innocence enfin reconnue",
    text: "La Cour de cassation annule définitivement la condamnation de Dreyfus, sans renvoi : il est officiellement innocent. Il est réintégré dans l'armée avec le grade de commandant et reçoit la Légion d'honneur. Picquart, lui, est réintégré et deviendra ministre de la Guerre.",
    press: "Douze ans après l'arrestation, c'est notamment grâce à la mobilisation d'une partie de la presse, d'intellectuels et de citoyens que la vérité a pu émerger et que la justice a été rendue.",
    question: "Sans la presse, l'affaire Dreyfus aurait-elle pu être révélée ? Justifie ta réponse."
  }
];

const timeline = document.getElementById("timeline");
const panel = document.getElementById("panel");
const progress = document.getElementById("progress");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
let current = 0;
const visited = new Set([0]);

// Construction des boutons de la frise
steps.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "step";
  b.setAttribute("role", "tab");
  b.setAttribute("aria-label", s.year + " : " + s.tag);
  b.innerHTML = '<span class="dot"></span><span class="year">' + s.year + '</span><span class="tag">' + s.tag + '</span>';
  b.addEventListener("click", () => show(i));
  timeline.appendChild(b);
});

function show(i) {
  current = i;
  visited.add(i);
  const s = steps[i];

  document.querySelectorAll(".step").forEach((el, idx) => {
    el.classList.toggle("active", idx === i);
    el.classList.toggle("visited", visited.has(idx) && idx !== i);
    el.setAttribute("aria-selected", idx === i ? "true" : "false");
  });

  panel.classList.remove("fade");
  void panel.offsetWidth; // relance l'animation
  panel.classList.add("fade");
  panel.innerHTML =
    '<p class="date">' + s.date + '</p>' +
    '<h2>' + s.title + '</h2>' +
    '<p>' + s.text + '</p>' +
    '<div class="press"><strong>📰 Rôle de la presse :</strong> ' + s.press + '</div>' +
    '<p class="question">' + s.question + '</p>';

  progress.style.width = (84 * i / (steps.length - 1)) + "%";
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === steps.length - 1;
}

prevBtn.addEventListener("click", () => current > 0 && show(current - 1));
nextBtn.addEventListener("click", () => current < steps.length - 1 && show(current + 1));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" && current < steps.length - 1) show(current + 1);
  if (e.key === "ArrowLeft" && current > 0) show(current - 1);
});

show(0);
</script>
</body>
</html>
